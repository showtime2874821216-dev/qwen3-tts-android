          new_play = """    fun playAudio(historyGenerationId: Long? = null) {
              val samples = generatedAudio ?: return
              val sampleRate = _uiState.value.sampleRate.takeIf { it > 0 } ?: 24_000
              stopAudio()
              playJob = viewModelScope.launch(Dispatchers.IO) {
                  val minBuf = AudioTrack.getMinBufferSize(
                      sampleRate,
                      AudioFormat.CHANNEL_OUT_MONO,
                      AudioFormat.ENCODING_PCM_FLOAT,
                  ).coerceAtLeast(sampleRate / 4 * 4)
                  val track = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build(),
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_FLOAT)
                              .setSampleRate(sampleRate)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build(),
                      )
                      .setBufferSizeInBytes(minBuf * 2)
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()

                  activeTrack = track
                  _uiState.update { it.copy(playing = true, playingGenerationId = historyGenerationId) }
                  try {
                      track.play()
                      var offset = 0
                      val step = 4096
                      while (offset < samples.size) {
                          val count = minOf(step, samples.size - offset)
                          val written = track.write(samples, offset, count, AudioTrack.WRITE_BLOCKING)
                          if (written <= 0) break
                          offset += written
                      }
                      kotlinx.coroutines.delay(250L)
                  } finally {
                      runCatching { track.stop() }
                      runCatching { track.release() }
                      if (activeTrack == track) activeTrack = null
                      _uiState.update { it.copy(playing = false, playingGenerationId = null) }
                  }
              }
          }
          """
