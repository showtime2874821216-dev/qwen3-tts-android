              ('LanguageOption("Korean", 2064)', 'LanguageOption("韩语 (Korean)", 2064)'),
              ('LanguageOption("Russian", 2069)', 'LanguageOption("俄语 (Russian)", 2069)'),
          ]
          for a, b in lang_repls:
              s = s.replace(a, b)

          # 2b. Add 6 official Serveurperso/Qwen3-TTS-GGUF Base voice-cloning models
          old_variants = "    val variants = listOf(defaultVariant)"
          new_variants = """    val q8Variant: ModelVariant = variant(
              id = "q8_0",
              label = "0.6B Q8",
              displayName = "Qwen3-TTS 0.6B Q8_0 (均衡推荐 · 1.28GB)",
