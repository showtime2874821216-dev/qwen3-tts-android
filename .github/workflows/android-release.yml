name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0. Defaults to auto run number."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (CN v6 Resume)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize build submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Resolve release version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              version="${{ github.ref_name }}"
            else
              version="0.2.${{ github.run_number }}"
            fi
          fi
          release_version="${version#v}"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Install Permanent Fixed Signing Keystore & Lock Gradle Signing + VersionCode
        run: |
          mkdir -p "$HOME/.android"
          base64 -d << 'KS_EOF' > app/personal_fixed.keystore
          
          KS_EOF
          cp app/personal_fixed.keystore "$HOME/.android/debug.keystore"
          ls -lh app/personal_fixed.keystore "$HOME/.android/debug.keystore"

          python3 - << 'PY'
          import os, re
          from pathlib import Path

          gradle_path = Path("app/build.gradle.kts")
          gs = gradle_path.read_text(encoding="utf-8")

          # 1. Auto-bump versionCode & versionName so Android always treats new builds as upgrades
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          ver_code = 200 + run_num
          ver_name = os.environ.get("RELEASE_VERSION", f"0.2.{run_num}")
          gs = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {ver_code}", gs, count=1)
          gs = re.sub(r'versionName\s*=\s*"[^"]*"', f'versionName = "{ver_name}"', gs, count=1)

          # 2. Explicitly bind debug signingConfig to app/personal_fixed.keystore so Gradle NEVER generates a random key
          signing_block = """
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("personal_fixed.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          """
          if 'personal_fixed.keystore' not in gs:
              m_android = re.search(r"android\s*\{", gs)
              assert m_android, "Could not find android { in app/build.gradle.kts"
              pos = m_android.end()
              gs = gs[:pos] + "\n" + signing_block + gs[pos:]

          gradle_path.write_text(gs, encoding="utf-8")
          print(f"Patched app/build.gradle.kts: versionCode={ver_code}, versionName={ver_name}, locked personal_fixed.keystore!")
          PY

      - name: Optimize Native CMake for Snapdragon 8 Elite (SM8750)
        run: |
          python3 - << 'PY'
          import re
          from pathlib import Path

          cmake = Path("app/src/main/cpp/CMakeLists.txt")
          s = cmake.read_text(encoding="utf-8")
          turbo_block = """
          # === Snapdragon 8 Elite (SM8750) Turbo Optimization ===
          set(CMAKE_BUILD_TYPE "Release" CACHE STRING "" FORCE)
          set(CMAKE_C_FLAGS_DEBUG "-O3 -DNDEBUG -march=armv8.2-a+dotprod+fp16+i8mm" CACHE STRING "" FORCE)
          set(CMAKE_CXX_FLAGS_DEBUG "-O3 -DNDEBUG -march=armv8.2-a+dotprod+fp16+i8mm" CACHE STRING "" FORCE)
          set(CMAKE_C_FLAGS_RELEASE "-O3 -DNDEBUG -march=armv8.2-a+dotprod+fp16+i8mm" CACHE STRING "" FORCE)
          set(CMAKE_CXX_FLAGS_RELEASE "-O3 -DNDEBUG -march=armv8.2-a+dotprod+fp16+i8mm" CACHE STRING "" FORCE)
          add_compile_definitions(NDEBUG)
          add_compile_options(-O3 -DNDEBUG -march=armv8.2-a+dotprod+fp16+i8mm)
          add_link_options(-Wl,-z,max-page-size=16384)
          """
          if "Snapdragon 8 Elite (SM8750) Turbo Optimization" not in s:
              m = re.search(r'^project\s*\([^\n]*\)\s*$', s, re.M)
              if not m:
                  m = re.search(r'^cmake_minimum_required\s*\([^\n]*\)\s*$', s, re.M)
              assert m, "Could not find project() or cmake_minimum_required() in CMakeLists.txt"
              pos = m.end()
              s = s[:pos] + "\n" + turbo_block + "\n" + s[pos:]
              cmake.write_text(s, encoding="utf-8")
              print("CMakeLists.txt patched with Release + SM8750 SIMD!")
          PY

      - name: Inject Background Service + Chinese UI + Auto-Embedding + 6 Models + Progress Bar
        run: |
          cat << 'AUDIO_EOF' > app/src/main/java/com/qwen/tts/android/data/AudioImporter.kt
          package com.qwen.tts.android.data

          import android.content.Context
          import android.media.AudioFormat
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.net.Uri
          import android.os.Build
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.OutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          object AudioImporter {
              private const val TARGET_SAMPLE_RATE = 24_000
              private const val MAX_DURATION_US = 15_000_000L

              fun importToWav24k(
                  context: Context,
                  sourceUri: Uri,
                  outputWavFile: File,
              ): RecordingResult {
                  val extractor = MediaExtractor()
                  try {
                      extractor.setDataSource(context, sourceUri, null)
                      var trackIndex = -1
                      for (i in 0 until extractor.trackCount) {
                          val mime = extractor.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: continue
                          if (mime.startsWith("audio/")) {
                              trackIndex = i
                              break
                          }
                      }
                      require(trackIndex >= 0) { "所选文件中未找到有效音轨" }

                      extractor.selectTrack(trackIndex)
                      val format = extractor.getTrackFormat(trackIndex)
                      val mime = format.getString(MediaFormat.KEY_MIME)
                          ?: throw IllegalArgumentException("无法识别音频格式")

                      var sampleRate = format.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                      var channels = format.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                      var encoding = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N &&
                          format.containsKey(MediaFormat.KEY_PCM_ENCODING)
                      ) {
                          format.getInteger(MediaFormat.KEY_PCM_ENCODING)
                      } else {
                          AudioFormat.ENCODING_PCM_16BIT
                      }

                      val pcmOut = ByteArrayOutputStream()
                      val codec = MediaCodec.createDecoderByType(mime)
                      try {
                          codec.configure(format, null, null, 0)
                          codec.start()

                          val info = MediaCodec.BufferInfo()
                          var inputDone = false
                          var outputDone = false

                          while (!outputDone) {
                              if (!inputDone) {
                                  val inIdx = codec.dequeueInputBuffer(10_000L)
                                  if (inIdx >= 0) {
                                      val inBuf = codec.getInputBuffer(inIdx)
                                      if (inBuf != null) {
                                          val size = extractor.readSampleData(inBuf, 0)
                                          val pts = extractor.sampleTime
                                          if (size < 0 || pts > MAX_DURATION_US) {
                                              codec.queueInputBuffer(inIdx, 0, 0, 0L, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                              inputDone = true
                                          } else {
                                              codec.queueInputBuffer(inIdx, 0, size, pts, 0)
                                              extractor.advance()
                                          }
                                      }
                                  }
                              }

                              val outIdx = codec.dequeueOutputBuffer(info, 10_000L)
                              when {
                                  outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED -> {
                                      val outFmt = codec.outputFormat
                                      if (outFmt.containsKey(MediaFormat.KEY_SAMPLE_RATE)) {
                                          sampleRate = outFmt.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                                      }
                                      if (outFmt.containsKey(MediaFormat.KEY_CHANNEL_COUNT)) {
                                          channels = outFmt.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                                      }
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N &&
                                          outFmt.containsKey(MediaFormat.KEY_PCM_ENCODING)
                                      ) {
                                          encoding = outFmt.getInteger(MediaFormat.KEY_PCM_ENCODING)
                                      }
                                  }
                                  outIdx >= 0 -> {
                                      val outBuf = codec.getOutputBuffer(outIdx)
                                      if (outBuf != null && info.size > 0 && info.presentationTimeUs <= MAX_DURATION_US) {
                                          val chunk = ByteArray(info.size)
                                          outBuf.position(info.offset)
                                          outBuf.limit(info.offset + info.size)
                                          outBuf.get(chunk)
                                          pcmOut.write(chunk)
                                      }
                                      codec.releaseOutputBuffer(outIdx, false)
                                      if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) {
                                          outputDone = true
                                      }
                                  }
                              }
                          }
                      } finally {
                          runCatching { codec.stop() }
                          runCatching { codec.release() }
                      }

                      val mono = decodeToMonoFloat(pcmOut.toByteArray(), channels, encoding)
                      require(mono.isNotEmpty()) { "解码后的音频为空" }

                      val resampled = resampleLinear(mono, sampleRate, TARGET_SAMPLE_RATE)
                      val normalized = normalizePeak(resampled)
                      val pcm16Bytes = ByteArray(normalized.size * 2)
                      for (i in normalized.indices) {
                          val s = (normalized[i] * 32767f).toInt().coerceIn(Short.MIN_VALUE.toInt(), Short.MAX_VALUE.toInt())
                          pcm16Bytes[i * 2] = (s and 0xff).toByte()
                          pcm16Bytes[i * 2 + 1] = ((s shr 8) and 0xff).toByte()
                      }

                      outputWavFile.parentFile?.mkdirs()
                      outputWavFile.outputStream().use { out ->
                          writeWavHeader(out, pcm16Bytes.size, TARGET_SAMPLE_RATE)
                          out.write(pcm16Bytes)
                      }
                      val durationMs = (normalized.size.toLong() * 1000L) / TARGET_SAMPLE_RATE.toLong()
                      return RecordingResult(file = outputWavFile, durationMillis = durationMs)
                  } finally {
                      runCatching { extractor.release() }
                  }
              }

              private fun decodeToMonoFloat(bytes: ByteArray, channels: Int, encoding: Int): FloatArray {
                  val ch = channels.coerceAtLeast(1)
                  val bb = ByteBuffer.wrap(bytes).order(ByteOrder.LITTLE_ENDIAN)
                  return when (encoding) {
                      AudioFormat.ENCODING_PCM_FLOAT -> {
                          val frames = bytes.size / (4 * ch)
                          FloatArray(frames) { f ->
                              var acc = 0f
                              for (c in 0 until ch) acc += bb.getFloat((f * ch + c) * 4)
                              (acc / ch).coerceIn(-1f, 1f)
                          }
                      }
                      AudioFormat.ENCODING_PCM_8BIT -> {
                          val frames = bytes.size / ch
                          FloatArray(frames) { f ->
                              var acc = 0f
                              for (c in 0 until ch) acc += ((bytes[f * ch + c].toInt() and 0xFF) - 128) / 128f
                              (acc / ch).coerceIn(-1f, 1f)
                          }
                      }
                      else -> {
                          val frames = bytes.size / (2 * ch)
                          FloatArray(frames) { f ->
                              var acc = 0f
                              for (c in 0 until ch) acc += bb.getShort((f * ch + c) * 2).toFloat() / 32768f
                              (acc / ch).coerceIn(-1f, 1f)
                          }
                      }
                  }
              }

              private fun resampleLinear(input: FloatArray, srcRate: Int, dstRate: Int): FloatArray {
                  if (input.isEmpty() || srcRate <= 0 || srcRate == dstRate) return input
                  val ratio = srcRate.toDouble() / dstRate.toDouble()
                  val outLen = max(1, (input.size / ratio).toInt())
                  return FloatArray(outLen) { i ->
                      val pos = i * ratio
                      val idx0 = pos.toInt().coerceIn(0, input.size - 1)
                      val idx1 = min(idx0 + 1, input.size - 1)
                      val frac = (pos - idx0).toFloat()
                      input[idx0] * (1f - frac) + input[idx1] * frac
                  }
              }

              private fun normalizePeak(samples: FloatArray): FloatArray {
                  var peak = 0f
                  for (v in samples) {
                      val a = abs(v)
                      if (a > peak) peak = a
                  }
                  if (peak < 1e-4f) return samples
                  val gain = (0.89f / peak).coerceAtMost(6.0f)
                  return FloatArray(samples.size) { i -> (samples[i] * gain).coerceIn(-1f, 1f) }
              }

              private fun writeWavHeader(out: OutputStream, pcmBytesSize: Int, sampleRate: Int) {
                  val bb = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN)
                  bb.put("RIFF".toByteArray(Charsets.US_ASCII))
                  bb.putInt(36 + pcmBytesSize)
                  bb.put("WAVE".toByteArray(Charsets.US_ASCII))
                  bb.put("fmt ".toByteArray(Charsets.US_ASCII))
                  bb.putInt(16)
                  bb.putShort(1)
                  bb.putShort(1)
                  bb.putInt(sampleRate)
                  bb.putInt(sampleRate * 2)
                  bb.putShort(2)
                  bb.putShort(16)
                  bb.put("data".toByteArray(Charsets.US_ASCII))
                  bb.putInt(pcmBytesSize)
                  out.write(bb.array())
              }
          }
          AUDIO_EOF

          cat << 'SVC_EOF' > app/src/main/java/com/qwen/tts/android/data/TtsForegroundService.kt
          package com.qwen.tts.android.data

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          class TtsForegroundService : Service() {
              private var wakeLock: PowerManager.WakeLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action
                  if (action == ACTION_STOP) {
                      releaseWakeLock()
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                          stopForeground(STOP_FOREGROUND_REMOVE)
                      } else {
                          @Suppress("DEPRECATION")
                          stopForeground(true)
                      }
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val progress = intent?.getIntExtra(EXTRA_PROGRESS, 0) ?: 0
                  val status = intent?.getStringExtra(EXTRA_STATUS) ?: "正在后台生成语音..."
                  ensureChannel()
                  acquireWakeLock()

                  val notification = buildNotification(progress, status)
                  runCatching {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                      } else {
                          startForeground(NOTIF_ID, notification)
                      }
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  releaseWakeLock()
                  super.onDestroy()
              }

              private fun ensureChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      val existing = nm.getNotificationChannel(CHANNEL_ID)
                      if (existing == null) {
                          val ch = NotificationChannel(
                              CHANNEL_ID,
                              "后台语音生成进度",
                              NotificationManager.IMPORTANCE_LOW,
                          )
                          ch.description = "保持语音合成在切到后台时持续运行"
                          nm.createNotificationChannel(ch)
                      }
                  }
              }

              private fun buildNotification(progress: Int, status: String): Notification {
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }
                  return builder
                      .setContentTitle("Qwen3 TTS 后台生成中 (${progress.coerceIn(0, 100)}%)")
                      .setContentText(status)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setProgress(100, progress.coerceIn(0, 100), progress <= 0)
                      .build()
              }

              private fun acquireWakeLock() {
                  if (wakeLock?.isHeld == true) return
                  runCatching {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Qwen3TTS:SynthWakeLock").apply {
                          setReferenceCounted(false)
                          acquire(60 * 60 * 1000L)
                      }
                  }
              }

              private fun releaseWakeLock() {
                  runCatching {
                      if (wakeLock?.isHeld == true) wakeLock?.release()
                  }
                  wakeLock = null
              }

              companion object {
                  private const val CHANNEL_ID = "qwen_tts_bg_synth"
                  private const val NOTIF_ID = 10086
                  private const val ACTION_UPDATE = "com.qwen.tts.android.BG_UPDATE"
                  private const val ACTION_STOP = "com.qwen.tts.android.BG_STOP"
                  private const val EXTRA_PROGRESS = "progress"
                  private const val EXTRA_STATUS = "status"

                  fun update(context: Context, progress: Int, status: String) {
                      runCatching {
                          val i = Intent(context, TtsForegroundService::class.java).apply {
                              action = ACTION_UPDATE
                              putExtra(EXTRA_PROGRESS, progress)
                              putExtra(EXTRA_STATUS, status)
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(i)
                          } else {
                              context.startService(i)
                          }
                      }
                  }

                  fun stop(context: Context) {
                      runCatching {
                          val i = Intent(context, TtsForegroundService::class.java).apply {
                              action = ACTION_STOP
                          }
                          context.startService(i)
                      }
                  }
              }
          }
          SVC_EOF

          python3 - << 'PY'
          import re
          from pathlib import Path

          # 0. Patch AndroidManifest.xml for Foreground Service & WakeLock
          manifest_path = Path("app/src/main/AndroidManifest.xml")
          ms = manifest_path.read_text(encoding="utf-8")
          perms = [
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          for perm in perms:
              if perm.strip() not in ms:
                  ms = ms.replace("<application", perm + "\n    <application", 1)
          svc_decl = '        <service\n            android:name=".data.TtsForegroundService"\n            android:exported="false"\n            android:foregroundServiceType="dataSync" />\n'
          if "TtsForegroundService" not in ms:
              ms = ms.replace("</application>", svc_decl + "    </application>", 1)
