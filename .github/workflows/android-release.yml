              ('"Audio so far ~', '"已生成音频 ~'),
          ]
          for old_str, new_str in ui_zh_map:
              s = s.replace(old_str, new_str)

          # 2k. Add FileOutputStream import & inject additive downloadModelResumable() without deleting any existing ViewModel methods
          if "import java.io.FileOutputStream" not in s:
              s = s.replace("import java.io.File", "import java.io.File\nimport java.io.FileOutputStream", 1)

          # Detect exact class-level model directory property used by QwenTtsViewModel
          class_props = set(re.findall(r"^    (?:private\s+)?val\s+([A-Za-z_][A-Za-z0-9_]*)\b", s, re.M))
          print(f"Class-level properties: {sorted(class_props)}")
          model_dir_expr = None
          for cand in ("modelDir", "modelsDir", "modelRootDir", "modelsRootDir"):
              if cand in class_props:
                  model_dir_expr = cand
                  break
          if not model_dir_expr:
              m_talker = re.search(r"File\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*,\s*[^,\n]*talkerName", s)
              if m_talker and m_talker.group(1) in class_props:
                  model_dir_expr = m_talker.group(1)
          if not model_dir_expr:
              model_dir_expr = 'getApplication<Application>().filesDir'
          print(f"Resolved model_dir_expr={model_dir_expr}")

          resumable_dl_fn = """

          fun downloadModelResumable() {
              if (_uiState.value.busy || _uiState.value.downloading) return
              val variant = selectedVariant()
              viewModelScope.launch {
                  _uiState.update {
                      it.copy(
                          busy = true,
                          downloading = true,
                          downloadProgress = 0f,
                          downloadBytes = 0L,
                          downloadTotalBytes = variant.totalBytes,
                          status = "准备下载 ${variant.label}...",
                          error = null,
                      )
                  }
                  com.qwen.tts.android.data.TtsForegroundService.update(
                      getApplication(),
                      1,
                      "正在下载 ${variant.label}（支持断点续传）",
                  )

                  val outcome = runCatching {
                      withContext(Dispatchers.IO) {
                          val dir = __MODEL_DIR_EXPR__
                          dir.mkdirs()
                          val totalExpected = variant.files.sumOf { it.sizeBytes }.coerceAtLeast(1L)
                          var completedBefore = 0L

                          for ((fileIdx, modelFile) in variant.files.withIndex()) {
                              val url = modelFile.url ?: error("缺少模型下载地址: ${modelFile.name}")
                              val dest = File(dir, modelFile.name)
                              if (dest.exists() && dest.length() >= (modelFile.sizeBytes * 0.90).toLong()) {
                                  completedBefore += dest.length()
                                  continue
                              }
                              val fileLabel = "${fileIdx + 1}/${variant.files.size} ${modelFile.name}"
                              val downloadedLen = downloadFileWithRangeResume(
                                  primaryUrl = url,
                                  destFile = dest,
                                  expectedSize = modelFile.sizeBytes,
                                  onProgress = { curFileBytes, curFileTotal, note ->
                                      val overallBytes = completedBefore + curFileBytes
                                      val denom = maxOf(totalExpected, completedBefore + curFileTotal)
                                      val frac = (overallBytes.toFloat() / denom.toFloat()).coerceIn(0f, 0.99f)
                                      val pct = (frac * 100f).toInt()
                                      val mbCur = overallBytes / (1024L * 1024L)
                                      val mbTot = denom / (1024L * 1024L)
                                      _uiState.update {
                                          it.copy(
                                              downloading = true,
                                              downloadProgress = frac,
                                              downloadBytes = overallBytes,
                                              downloadTotalBytes = denom,
                                              status = "下载 $fileLabel ($mbCur/${mbTot}MB) $note",
                                          )
                                      }
                                      com.qwen.tts.android.data.TtsForegroundService.update(
                                          getApplication(),
                                          pct,
                                          "下载 ${variant.label}: $mbCur/${mbTot}MB $note",
                                      )
                                  },
                              )
                              completedBefore += downloadedLen
                          }
                      }
                  }

                  com.qwen.tts.android.data.TtsForegroundService.stop(getApplication())

                  outcome.fold(
                      onSuccess = {
                          _uiState.update {
                              it.copy(
                                  busy = false,
                                  downloading = false,
                                  downloadProgress = 1f,
                                  downloadBytes = variant.totalBytes,
                                  downloadTotalBytes = variant.totalBytes,
                                  modelReady = true,
                                  status = "模型下载完成，可点击加载模型",
                                  error = null,
                              )
                          }
                      },
                      onFailure = { throwable ->
                          _uiState.update {
                              it.copy(
                                  busy = false,
                                  downloading = false,
                                  status = "下载中断（已保留进度，再点下载可续传）",
                                  error = "下载中断（已保留断点，点下载继续）: ${throwable.message ?: "网络异常"}",
                              )
                          }
                      },
                  )
              }
          }

          private fun openConnFollowRedirects(
              urlStr: String,
              rangeStart: Long,
          ): HttpURLConnection {
              var currentUrl = urlStr
              var hops = 0
              while (hops < 8) {
                  val conn = (URL(currentUrl).openConnection() as HttpURLConnection).apply {
                      instanceFollowRedirects = false
                      connectTimeout = 30_000
                      readTimeout = 45_000
                      requestMethod = "GET"
                      setRequestProperty("User-Agent", "Qwen3TTS-Android/0.2")
                      setRequestProperty("Accept-Encoding", "identity")
                      if (rangeStart > 0L) {
                          setRequestProperty("Range", "bytes=$rangeStart-")
                      }
                  }
                  val code = conn.responseCode
                  if (code in listOf(301, 302, 303, 307, 308)) {
                      val loc = conn.getHeaderField("Location")
                          ?: error("HTTP $code 缺少重定向地址")
                      conn.disconnect()
                      currentUrl = URL(URL(currentUrl), loc).toString()
                      hops++
                      continue
                  }
                  return conn
              }
              error("重定向次数过多")
          }

          private fun downloadFileWithRangeResume(
              primaryUrl: String,
              destFile: File,
              expectedSize: Long,
              onProgress: (Long, Long, String) -> Unit,
          ): Long {
              val partFile = File(destFile.parentFile, "${destFile.name}.part")
              val mirrorUrl = primaryUrl.replace("https://huggingface.co/", "https://hf-mirror.com/")
              val maxAttempts = 16
              var lastError: Throwable? = null
              var useMirror = false

              for (attempt in 1..maxAttempts) {
                  val activeUrl = if (useMirror && mirrorUrl != primaryUrl) mirrorUrl else primaryUrl
                  val sourceTag = if (useMirror) "[镜像线路]" else "[官方线路]"
                  var existing = if (partFile.exists()) partFile.length() else 0L
                  var conn: HttpURLConnection? = null

                  try {
                      conn = openConnFollowRedirects(activeUrl, existing)
                      val code = conn.responseCode

                      if (code == 416) {
                          if (partFile.exists() && partFile.length() > 0L) {
                              if (destFile.exists()) destFile.delete()
                              partFile.renameTo(destFile)
                              return destFile.length()
                          }
                      }

                      if (code != 200 && code != 206) {
                          error("HTTP $code")
                      }

                      val appendMode = (code == 206 && existing > 0L)
                      if (!appendMode && existing > 0L) {
                          existing = 0L
                      }

                      val contentLen = if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.N) {
                          conn.contentLengthLong
                      } else {
                          conn.getHeaderField("Content-Length")?.toLongOrNull() ?: -1L
                      }
                      val totalLen = when {
                          appendMode && contentLen > 0L -> existing + contentLen
                          !appendMode && contentLen > 0L -> contentLen
                          else -> expectedSize
                      }

                      onProgress(existing, totalLen, if (attempt > 1) "$sourceTag 续传第${attempt}次" else sourceTag)

                      val buf = ByteArray(128 * 1024)
                      var downloaded = existing
                      var lastReportMs = 0L

                      conn.inputStream.use { input ->
                          FileOutputStream(partFile, appendMode).use { output ->
                              while (true) {
                                  val read = input.read(buf)
                                  if (read <= 0) break
                                  output.write(buf, 0, read)
                                  downloaded += read
                                  val now = SystemClock.elapsedRealtime()
                                  if (now - lastReportMs >= 400L) {
                                      lastReportMs = now
                                      onProgress(downloaded, totalLen, sourceTag)
                                  }
                              }
                              output.flush()
                          }
                      }

                      if (contentLen > 0L && downloaded < totalLen) {
                          throw java.io.EOFException("连接提前断开 ($downloaded / $totalLen)")
                      }

                      if (destFile.exists()) destFile.delete()
                      if (!partFile.renameTo(destFile)) {
                          partFile.copyTo(destFile, overwrite = true)
                          partFile.delete()
                      }
                      onProgress(destFile.length(), destFile.length(), "完成")
                      return destFile.length()
                  } catch (e: Throwable) {
                      lastError = e
                      if (attempt % 2 == 0) {
                          useMirror = !useMirror
                      }
                      val waitMs = (attempt * 1500L).coerceAtMost(6000L)
                      onProgress(
                          if (partFile.exists()) partFile.length() else 0L,
                          expectedSize,
                          "断开重连中(${attempt}/$maxAttempts)...",
                      )
                      try {
                          Thread.sleep(waitMs)
                      } catch (_: InterruptedException) {
                          throw e
                      }
                  } finally {
                      runCatching { conn?.disconnect() }
                  }
              }
              throw lastError ?: IllegalStateException("多次重试后仍无法完成下载")
          }""".replace("__MODEL_DIR_EXPR__", model_dir_expr)

          s = s.replace(a1, a1 + resumable_dl_fn, 1)
          print("Injected additive downloadModelResumable() cleanly alongside cancelVoiceRecording()!")

          p.write_text(s, encoding="utf-8")
          print("ALL PATCHES APPLIED SUCCESSFULLY!")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Turbo Unlimited CN APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain

      - name: Verify Fixed APK Signature & Collect APK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_DIR/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/qwen3-tts-android-${RELEASE_VERSION}-arm64-v8a-cn-v6-resume.apk"
          ls -lh artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-android-${{ env.RELEASE_VERSION }}-cn-v6-resume
          path: artifacts/*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Qwen3 TTS Android ${{ env.RELEASE_VERSION }} 中文旗舰版 (断点续传)
          body: |
            Chinese UI, auto 0.6B/1.7B speaker embedding adapter, background ForegroundService keep-alive, visual progress bar + cancel button, 6 official Qwen3-TTS GGUF models, locked Gradle permanent signing key + auto versionCode bump, and anti-runaway 32-char chunking.
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: artifacts/*.apk
