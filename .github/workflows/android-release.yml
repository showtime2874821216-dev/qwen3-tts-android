          print("AndroidManifest.xml patched with ForegroundService + WakeLock!")

          # 1. Inspect QwenEngine.kt to detect exact NativeParams fields
          engine_path = Path("app/src/main/java/com/qwen/tts/studio/engine/QwenEngine.kt")
