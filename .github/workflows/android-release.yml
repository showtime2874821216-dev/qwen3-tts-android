name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0. Defaults to the tag name without v."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize build submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Install Permanent Fixed Signing Keystore
        run: |
          mkdir -p "$HOME/.android"
          base64 -d << 'KS_EOF' > "$HOME/.android/debug.keystore"
          
          KS_EOF
          ls -lh "$HOME/.android/debug.keystore"

      - name: Optimize Native CMake for Snapdragon 8 Elite (SM8750)
        run: |
          python3 - << 'PY'
          import re
          from pathlib import Path

          cmake = Path("app/src/main/cpp/CMakeLists.txt")
          s = cmake.read_text(encoding="utf-8")
          turbo_block = """
          # === Snapdragon 8 Elite (SM8750) Turbo Optimization ===
          set(CMAKE_BUILD_TYPE "Release" CACHE STRING "" FORCE)
          set(CMAKE_C_FLAGS_DEBUG "-O3 -DNDEBUG -march=armv8.2-a+dotprod+fp16+i8mm" CACHE STRING "" FORCE)
          set(CMAKE_CXX_FLAGS_DEBUG "-O3 -DNDEBUG -march=armv8.2-a+dotprod+fp16+i8mm" CACHE STRING "" FORCE)
          set(CMAKE_C_FLAGS_RELEASE "-O3 -DNDEBUG -march=armv8.2-a+dotprod+fp16+i8mm" CACHE STRING "" FORCE)
          set(CMAKE_CXX_FLAGS_RELEASE "-O3 -DNDEBUG -march=armv8.2-a+dotprod+fp16+i8mm" CACHE STRING "" FORCE)
          add_compile_definitions(NDEBUG)
          add_compile_options(-O3 -DNDEBUG -march=armv8.2-a+dotprod+fp16+i8mm)
          add_link_options(-Wl,-z,max-page-size=16384)
          """
          if "Snapdragon 8 Elite (SM8750) Turbo Optimization" not in s:
              m = re.search(r'^project\s*\([^\n]*\)\s*$', s, re.M)
              if not m:
                  m = re.search(r'^cmake_minimum_required\s*\([^\n]*\)\s*$', s, re.M)
              assert m, "Could not find project() or cmake_minimum_required() in CMakeLists.txt"
              pos = m.end()
              s = s[:pos] + "\n" + turbo_block + "\n" + s[pos:]
              cmake.write_text(s, encoding="utf-8")
              print("CMakeLists.txt patched with Release + SM8750 SIMD!")
          PY

      - name: Inject AudioImporter + Anti-Runaway Unlimited Chunking + Multi-Model Upgrade
        run: |
          cat << 'EOF' > app/src/main/java/com/qwen/tts/android/data/AudioImporter.kt
          package com.qwen.tts.android.data

          import android.content.Context
          import android.media.AudioFormat
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.net.Uri
          import android.os.Build
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.OutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          object AudioImporter {
              private const val TARGET_SAMPLE_RATE = 24_000
              private const val MAX_DURATION_US = 15_000_000L

              fun importToWav24k(
                  context: Context,
                  sourceUri: Uri,
                  outputWavFile: File,
              ): RecordingResult {
                  val extractor = MediaExtractor()
                  try {
                      extractor.setDataSource(context, sourceUri, null)
                      var trackIndex = -1
                      for (i in 0 until extractor.trackCount) {
                          val mime = extractor.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: continue
                          if (mime.startsWith("audio/")) {
                              trackIndex = i
                              break
                          }
                      }
                      require(trackIndex >= 0) { "所选文件中未找到有效音轨" }

                      extractor.selectTrack(trackIndex)
                      val format = extractor.getTrackFormat(trackIndex)
                      val mime = format.getString(MediaFormat.KEY_MIME)
                          ?: throw IllegalArgumentException("无法识别音频格式")

                      var sampleRate = format.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                      var channels = format.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                      var encoding = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N &&
                          format.containsKey(MediaFormat.KEY_PCM_ENCODING)
                      ) {
                          format.getInteger(MediaFormat.KEY_PCM_ENCODING)
                      } else {
                          AudioFormat.ENCODING_PCM_16BIT
                      }

                      val pcmOut = ByteArrayOutputStream()
                      val codec = MediaCodec.createDecoderByType(mime)
                      try {
                          codec.configure(format, null, null, 0)
                          codec.start()

                          val info = MediaCodec.BufferInfo()
                          var inputDone = false
                          var outputDone = false

                          while (!outputDone) {
                              if (!inputDone) {
                                  val inIdx = codec.dequeueInputBuffer(10_000L)
                                  if (inIdx >= 0) {
                                      val inBuf = codec.getInputBuffer(inIdx)
                                      if (inBuf != null) {
                                          val size = extractor.readSampleData(inBuf, 0)
                                          val pts = extractor.sampleTime
                                          if (size < 0 || pts > MAX_DURATION_US) {
                                              codec.queueInputBuffer(inIdx, 0, 0, 0L, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                              inputDone = true
                                          } else {
                                              codec.queueInputBuffer(inIdx, 0, size, pts, 0)
                                              extractor.advance()
                                          }
                                      }
                                  }
                              }

                              val outIdx = codec.dequeueOutputBuffer(info, 10_000L)
                              when {
                                  outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED -> {
                                      val outFmt = codec.outputFormat
                                      if (outFmt.containsKey(MediaFormat.KEY_SAMPLE_RATE)) {
                                          sampleRate = outFmt.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                                      }
                                      if (outFmt.containsKey(MediaFormat.KEY_CHANNEL_COUNT)) {
                                          channels = outFmt.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                                      }
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N &&
                                          outFmt.containsKey(MediaFormat.KEY_PCM_ENCODING)
                                      ) {
                                          encoding = outFmt.getInteger(MediaFormat.KEY_PCM_ENCODING)
                                      }
                                  }
                                  outIdx >= 0 -> {
                                      val outBuf = codec.getOutputBuffer(outIdx)
                                      if (outBuf != null && info.size > 0 && info.presentationTimeUs <= MAX_DURATION_US) {
                                          val chunk = ByteArray(info.size)
                                          outBuf.position(info.offset)
                                          outBuf.limit(info.offset + info.size)
                                          outBuf.get(chunk)
                                          pcmOut.write(chunk)
                                      }
                                      codec.releaseOutputBuffer(outIdx, false)
                                      if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) {
                                          outputDone = true
                                      }
                                  }
                              }
                          }
                      } finally {
                          runCatching { codec.stop() }
                          runCatching { codec.release() }
                      }

                      val mono = decodeToMonoFloat(pcmOut.toByteArray(), channels, encoding)
                      require(mono.isNotEmpty()) { "解码后的音频为空" }

                      val resampled = resampleLinear(mono, sampleRate, TARGET_SAMPLE_RATE)
                      val normalized = normalizePeak(resampled)
                      val pcm16Bytes = ByteArray(normalized.size * 2)
                      for (i in normalized.indices) {
                          val s = (normalized[i] * 32767f).toInt().coerceIn(Short.MIN_VALUE.toInt(), Short.MAX_VALUE.toInt())
                          pcm16Bytes[i * 2] = (s and 0xff).toByte()
                          pcm16Bytes[i * 2 + 1] = ((s shr 8) and 0xff).toByte()
                      }

                      outputWavFile.parentFile?.mkdirs()
                      outputWavFile.outputStream().use { out ->
                          writeWavHeader(out, pcm16Bytes.size, TARGET_SAMPLE_RATE)
                          out.write(pcm16Bytes)
                      }
                      val durationMs = (normalized.size.toLong() * 1000L) / TARGET_SAMPLE_RATE.toLong()
                      return RecordingResult(file = outputWavFile, durationMillis = durationMs)
                  } finally {
                      runCatching { extractor.release() }
                  }
              }

              private fun decodeToMonoFloat(bytes: ByteArray, channels: Int, encoding: Int): FloatArray {
                  val ch = channels.coerceAtLeast(1)
                  val bb = ByteBuffer.wrap(bytes).order(ByteOrder.LITTLE_ENDIAN)
                  return when (encoding) {
                      AudioFormat.ENCODING_PCM_FLOAT -> {
                          val frames = bytes.size / (4 * ch)
                          FloatArray(frames) { f ->
                              var acc = 0f
                              for (c in 0 until ch) acc += bb.getFloat((f * ch + c) * 4)
                              (acc / ch).coerceIn(-1f, 1f)
                          }
                      }
                      AudioFormat.ENCODING_PCM_8BIT -> {
                          val frames = bytes.size / ch
                          FloatArray(frames) { f ->
                              var acc = 0f
                              for (c in 0 until ch) acc += ((bytes[f * ch + c].toInt() and 0xFF) - 128) / 128f
                              (acc / ch).coerceIn(-1f, 1f)
                          }
                      }
                      else -> {
                          val frames = bytes.size / (2 * ch)
                          FloatArray(frames) { f ->
                              var acc = 0f
                              for (c in 0 until ch) acc += bb.getShort((f * ch + c) * 2).toFloat() / 32768f
                              (acc / ch).coerceIn(-1f, 1f)
                          }
                      }
                  }
              }

              private fun resampleLinear(input: FloatArray, srcRate: Int, dstRate: Int): FloatArray {
                  if (input.isEmpty() || srcRate <= 0 || srcRate == dstRate) return input
                  val ratio = srcRate.toDouble() / dstRate.toDouble()
                  val outLen = max(1, (input.size / ratio).toInt())
                  return FloatArray(outLen) { i ->
                      val pos = i * ratio
                      val idx0 = pos.toInt().coerceIn(0, input.size - 1)
                      val idx1 = min(idx0 + 1, input.size - 1)
                      val frac = (pos - idx0).toFloat()
                      input[idx0] * (1f - frac) + input[idx1] * frac
                  }
              }

              private fun normalizePeak(samples: FloatArray): FloatArray {
                  var peak = 0f
                  for (v in samples) {
                      val a = abs(v)
                      if (a > peak) peak = a
                  }
                  if (peak < 1e-4f) return samples
                  val gain = (0.89f / peak).coerceAtMost(6.0f)
                  return FloatArray(samples.size) { i -> (samples[i] * gain).coerceIn(-1f, 1f) }
              }

              private fun writeWavHeader(out: OutputStream, pcmBytesSize: Int, sampleRate: Int) {
                  val bb = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN)
                  bb.put("RIFF".toByteArray(Charsets.US_ASCII))
                  bb.putInt(36 + pcmBytesSize)
                  bb.put("WAVE".toByteArray(Charsets.US_ASCII))
                  bb.put("fmt ".toByteArray(Charsets.US_ASCII))
                  bb.putInt(16)
                  bb.putShort(1)
                  bb.putShort(1)
                  bb.putInt(sampleRate)
                  bb.putInt(sampleRate * 2)
                  bb.putShort(2)
                  bb.putShort(16)
                  bb.put("data".toByteArray(Charsets.US_ASCII))
                  bb.putInt(pcmBytesSize)
                  out.write(bb.array())
              }
          }
          EOF

          python3 - << 'PY'
          import re
          from pathlib import Path

          # 1. Inspect QwenEngine.kt to detect exact NativeParams fields (e.g. maxAudioTokens, repetitionPenalty)
          engine_path = Path("app/src/main/java/com/qwen/tts/studio/engine/QwenEngine.kt")
          engine_src = engine_path.read_text(encoding="utf-8")
          m_np = re.search(r"data\s+class\s+NativeParams\s*\(([^)]*)\)", engine_src, re.S)
          np_body = m_np.group(1) if m_np else ""
          print("=== Detected NativeParams ===")
          print(np_body)

          m_tok = re.search(r"\b(max[A-Za-z0-9_]*(?:Token|Frame|Step|Len)[A-Za-z0-9_]*)\s*:\s*Int\b", np_body, re.I)
          max_tok_field = m_tok.group(1) if m_tok else None

          m_rep = re.search(r"\b(rep[A-Za-z0-9_]*Penalty)\s*:\s*(Float|Double)\b", np_body, re.I)
          rep_pen_field = m_rep.group(1) if m_rep else None
          rep_pen_type = m_rep.group(2) if m_rep else None

          print(f"Detected max_tok_field={max_tok_field}, rep_pen_field={rep_pen_field} ({rep_pen_type})")

          np_args = ["languageId = _uiState.value.selectedLanguageId"]
          if max_tok_field:
              np_args.append(f"{max_tok_field} = tokenCap")
          if rep_pen_field:
              val_expr = "repPenalty.toDouble()" if rep_pen_type == "Double" else "repPenalty"
              np_args.append(f"{rep_pen_field} = {val_expr}")
          native_params_expr = "QwenEngine.NativeParams(" + ", ".join(np_args) + ")"

          # 2. Patch MainActivity.kt
          p = Path("app/src/main/java/com/qwen/tts/android/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          old_variants = "    val variants = listOf(defaultVariant)"
          new_variants = """    val q8Variant: ModelVariant = variant(
              id = "q8_0",
              label = "0.6B Q8",
              displayName = "Qwen3-TTS 0.6B Q8_0 (高音质推荐)",
              talkerName = "qwen-talker-0.6b-base-Q8_0.gguf",
              tokenizerName = "qwen-tokenizer-12hz-Q8_0.gguf",
              talkerSizeBytes = 980_000_000L,
              tokenizerSizeBytes = 285_000_000L,
          )

          val talker17bQ4Variant: ModelVariant = variant(
              id = "1.7b_q4_k_m",
              label = "1.7B Q4",
              displayName = "Qwen3-TTS 1.7B Q4_K_M (旗舰戏感)",
              talkerName = "qwen-talker-1.7b-base-Q4_K_M.gguf",
              tokenizerName = "qwen-tokenizer-12hz-Q4_K_M.gguf",
              talkerSizeBytes = 1_190_000_000L,
              tokenizerSizeBytes = 254_974_752L,
          )

          val variants = listOf(defaultVariant, q8Variant, talker17bQ4Variant)"""
          assert old_variants in s, "variants anchor missing"
          s = s.replace(old_variants, new_variants, 1)

          old_settings_call = "        ModelPanel(\n            state = state,\n            onDownload = viewModel::downloadModel,\n            onLoad = viewModel::loadModel,\n        )"
          new_settings_call = "        ModelPanel(\n            state = state,\n            onSelectModel = viewModel::selectModel,\n            onDownload = viewModel::downloadModel,\n            onLoad = viewModel::loadModel,\n        )"
          assert old_settings_call in s, "SettingsScreen ModelPanel anchor missing"
          s = s.replace(old_settings_call, new_settings_call, 1)

          old_model_panel = "private fun ModelPanel(\n    state: QwenTtsUiState,\n    onDownload: () -> Unit,\n    onLoad: () -> Unit,\n) {"
          new_model_panel = "private fun ModelPanel(\n    state: QwenTtsUiState,\n    onSelectModel: (String) -> Unit,\n    onDownload: () -> Unit,\n    onLoad: () -> Unit,\n) {"
          assert old_model_panel in s, "ModelPanel signature anchor missing"
          s = s.replace(old_model_panel, new_model_panel, 1)

          old_model_dl = "            if (state.downloading) {"
          model_chips = """            Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          QwenModel.variants.forEach { v ->
                              FilterChip(
                                  selected = state.selectedModelId == v.id,
                                  onClick = { onSelectModel(v.id) },
                                  enabled = !state.busy,
                                  label = { Text(v.label) },
                              )
                          }
                      }

                      if (state.downloading) {"""
          assert old_model_dl in s, "ModelPanel downloading anchor missing"
          s = s.replace(old_model_dl, model_chips, 1)

          old_threads = "listOf(4, 6).forEach { threads ->"
          assert old_threads in s, "threads anchor missing"
          s = s.replace(old_threads, "listOf(4, 6, 8).forEach { threads ->", 1)

          synth_start = s.index("    fun synthesize() {")
          synth_end = s.index("    fun startVoiceRecording() {")
          new_synth = """    fun synthesize() {
              val text = _uiState.value.text.trim()
              if (text.isEmpty() || _uiState.value.busy) return
              viewModelScope.launch {
                  val variant = selectedVariant()
                  val selectedVoice = _uiState.value.selectedVoiceId?.let { id -> voices.value.firstOrNull { it.voiceId == id } }
                  val chunks = splitLongTextUnlimited(text)
                  val estimate = estimateSynthesisMillis(text)
                  startBusy(status = "共 ${chunks.size} 段 · 准备生成", resetSynthesis = true, synthesisEstimate = estimate)

                  val result = runCatching {
                      withContext(Dispatchers.IO) {
                          val native = ensureEngineLoaded(variant)
                          val allChunks = ArrayList<FloatArray>(chunks.size)
                          var sampleRate = 24_000
                          var totalMs = 0L
                          var completedFrames = 0

                          fun synthOnePiece(piece: String, label: String, repPenalty: Float): Pair<FloatArray, Int> {
                              val tokenCap = computeSafeMaxAudioTokens(piece)
                              val baseFrames = completedFrames
                              var peakFrames = 0
                              native.setProgressCallback { frames, maxTokens ->
                                  if (frames > peakFrames) peakFrames = frames
                                  _uiState.update {
                                      it.copy(
                                          loaded = true,
                                          status = "$label (上限 ${tokenCap}帧)",
                                          synthesisFrames = baseFrames + frames,
                                          maxAudioTokens = maxTokens.coerceAtMost(tokenCap),
                                      )
                                  }
                              }
                              val nativeResult = native.synthesize(
                                  text = piece,
                                  speakerEmbeddingPath = selectedVoice?.speakerEmbeddingPath,
                                  params = __NATIVE_PARAMS_EXPR__,
                              )
                              if (!nativeResult.success || nativeResult.audio == null) {
                                  error(nativeResult.errorMsg ?: "$label synthesis failed")
                              }
                              sampleRate = nativeResult.sampleRate.takeIf { it > 0 } ?: sampleRate
                              totalMs += nativeResult.timeMs
                              val outFrames = (nativeResult.audio.size.toDouble() / sampleRate.toDouble() / 0.08).toInt()
                              return Pair(nativeResult.audio, maxOf(peakFrames, outFrames))
                          }

                          try {
                              for (idx in chunks.indices) {
                                  val chunkText = chunks[idx]
                                  val label = "第 ${idx + 1}/${chunks.size} 段"
                                  val tokenCap = computeSafeMaxAudioTokens(chunkText)
                                  val (audio, usedFrames) = synthOnePiece(chunkText, label, 1.12f)
                                  // Anti-runaway guard: if model hit the token ceiling without EOS and chunk is splittable, split in half and retry once
                                  if (usedFrames >= tokenCap - 3 && chunkText.length > 14) {
                                      val mid = chunkText.length / 2
                                      val part1 = chunkText.substring(0, mid).trim()
                                      val part2 = chunkText.substring(mid).trim()
                                      if (part1.isNotEmpty() && part2.isNotEmpty()) {
                                          val (a1, _) = synthOnePiece(part1, "$label-重试A", 1.18f)
                                          val (a2, _) = synthOnePiece(part2, "$label-重试B", 1.18f)
                                          val combined = mergeAudioChunksSmoothly(listOf(a1, a2), sampleRate)
                                          completedFrames += (combined.size.toDouble() / sampleRate.toDouble() / 0.08).toInt()
                                          allChunks.add(combined)
                                          continue
                                      }
                                  }
                                  completedFrames += (audio.size.toDouble() / sampleRate.toDouble() / 0.08).toInt()
                                  allChunks.add(audio)
                              }
                          } finally {
                              _uiState.update {
                                  it.copy(activeBackendName = native.getActiveBackendName()?.takeIf { name -> name.isNotBlank() })
                              }
                              native.setProgressCallback(null)
                          }
                          Triple(mergeAudioChunksSmoothly(allChunks, sampleRate), sampleRate, totalMs)
                      }
                  }

                  result.fold(
                      onSuccess = { (mergedAudio, sampleRate, totalMs) ->
                          stopBusyTicker()
                          generatedAudio = mergedAudio
                          val voiceName = selectedVoice?.name ?: "Default Voice"
                          persistGeneratedAudio(text, mergedAudio, sampleRate, voiceName, selectedVoice?.voiceId, totalMs)
                          _uiState.update {
                              it.copy(
                                  busy = false,
                                  loaded = true,
                                  status = "生成完成 (共 ${chunks.size} 段)",
                                  sampleRate = sampleRate,
                                  sampleCount = mergedAudio.size,
                                  synthesisMillis = totalMs,
                                  estimatedSynthesisMillis = null,
                                  estimateSampleCount = 0,
                                  error = null,
                              )
                          }
                          playAudio()
                      },
                      onFailure = { throwable ->
                          stopBusyTicker()
                          _uiState.update {
                              it.copy(
                                  busy = false,
                                  status = "Synthesis failed",
                                  error = throwable.message ?: "Synthesis failed",
                              )
                          }
                      },
                  )
              }
          }

          private fun computeSafeMaxAudioTokens(piece: String): Int {
              var cjk = 0
              var other = 0
              for (ch in piece) {
                  if (ch.isWhitespace()) continue
                  val code = ch.code
                  if (code in 0x3000..0x9FFF || code in 0xAC00..0xD7AF || code in 0xFF00..0xFFEF) {
                      cjk++
                  } else {
                      other++
                  }
              }
              // 12.5 Hz codec (~3.5 frames/CJK char normal). Cap at ~6 frames/CJK char + 48 buffer to prevent infinite EOS runaway.
              val est = (cjk * 6) + (other * 1.6).toInt() + 48
              return est.coerceIn(72, 220)
          }

          private fun splitLongTextUnlimited(raw: String): List<String> {
              val cleaned = raw
                  .replace("\\u200B", "")
                  .replace("\\uFEFF", "")
                  .replace("\\r\\n", "\\n")
                  .replace('\\r', '\\n')
                  .trim()
              if (cleaned.isEmpty()) return emptyList()

              val cjkCount = cleaned.count { it.code in 0x3000..0x9FFF || it.code in 0xAC00..0xD7AF }
              val isMostlyCjk = cjkCount * 3 >= cleaned.length
              val maxChars = if (isMostlyCjk) 32 else 90
              val minMergeChars = if (isMostlyCjk) 10 else 28

              val sentenceEnds = setOf('。', '！', '？', '!', '?', '\\n', '…', '；', ';')
              val clauseEnds = setOf('，', ',', '、', '：', ':')
              val closers = setOf('”', '’', '」', '』', ')', '）', '》', '"')

              val rawSentences = mutableListOf<String>()
              val buf = StringBuilder()
              var i = 0
              while (i < cleaned.length) {
                  val ch = cleaned[i]
                  if (ch == '\\n') {
                      val seg = buf.toString().trim()
                      if (seg.isNotEmpty()) rawSentences.add(seg)
                      buf.clear()
                      i++
                      continue
                  }
                  buf.append(ch)
                  val isDecimal = ch == '.' && i > 0 && i + 1 < cleaned.length && cleaned[i - 1].isDigit() && cleaned[i + 1].isDigit()
                  if (ch in sentenceEnds || (ch == '.' && !isDecimal)) {
                      while (i + 1 < cleaned.length && cleaned[i + 1] in closers) {
                          i++
                          buf.append(cleaned[i])
                      }
                      val seg = buf.toString().trim()
                      if (seg.isNotEmpty()) rawSentences.add(seg)
                      buf.clear()
                  }
                  i++
              }
              val tail = buf.toString().trim()
              if (tail.isNotEmpty()) rawSentences.add(tail)

              val bounded = mutableListOf<String>()
              for (seg in rawSentences) {
                  if (seg.length <= maxChars) {
                      bounded.add(seg)
                  } else {
                      var start = 0
                      while (start < seg.length) {
                          val end = minOf(start + maxChars, seg.length)
                          if (end == seg.length) {
                              val piece = seg.substring(start).trim()
                              if (piece.isNotEmpty()) bounded.add(piece)
                              break
                          }
                          var splitAt = -1
                          for (k in end downTo start + maxChars / 3) {
                              if (seg[k] in clauseEnds || (!isMostlyCjk && seg[k] == ' ')) {
                                  splitAt = k + 1
                                  break
                              }
                          }
                          if (splitAt <= start) splitAt = end
                          val piece = seg.substring(start, splitAt).trim()
                          if (piece.isNotEmpty()) bounded.add(piece)
                          start = splitAt
                      }
                  }
              }

              val merged = mutableListOf<String>()
              val cur = StringBuilder()
              for (piece in bounded) {
                  if (cur.isEmpty()) {
                      cur.append(piece)
                  } else if (cur.length < minMergeChars && cur.length + piece.length <= maxChars) {
                      if (!isMostlyCjk) cur.append(' ')
                      cur.append(piece)
                  } else {
                      merged.add(cur.toString().trim())
                      cur.clear()
                      cur.append(piece)
                  }
              }
              if (cur.isNotEmpty()) merged.add(cur.toString().trim())
              return merged
          }

          private fun mergeAudioChunksSmoothly(chunks: List<FloatArray>, sampleRate: Int): FloatArray {
              if (chunks.isEmpty()) return FloatArray(0)
              if (chunks.size == 1) return chunks[0]
              val pauseSamples = (sampleRate * 0.12).toInt()
              val fadeSamples = (sampleRate * 0.015).toInt()
              var totalLen = 0
              for (c in chunks) totalLen += c.size
              totalLen += pauseSamples * (chunks.size - 1)
              val out = FloatArray(totalLen)
              var pos = 0
              for (idx in chunks.indices) {
                  val c = chunks[idx]
                  val f = minOf(fadeSamples, c.size / 4)
                  for (i in c.indices) {
                      var v = c[i]
                      if (i < f) v *= (i.toFloat() / f.toFloat())
                      else if (i >= c.size - f) v *= ((c.size - 1 - i).toFloat() / f.toFloat())
                      out[pos + i] = v
                  }
                  pos += c.size
                  if (idx < chunks.lastIndex) pos += pauseSamples
              }
              return out
          }
          """.replace("__NATIVE_PARAMS_EXPR__", native_params_expr)
          s = s[:synth_start] + new_synth + "\n\n" + s[synth_end:]

          play_start = s.index("    fun playAudio(historyGenerationId: Long? = null) {")
