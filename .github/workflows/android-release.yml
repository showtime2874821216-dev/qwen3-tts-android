      - name: Resolve release version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              version="${{ github.ref_name }}"
            else
              version="0.1.${{ github.run_number }}"
            fi
          fi
          release_version="${version#v}"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Turbo Unlimited APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/qwen3-tts-android-${RELEASE_VERSION}-arm64-v8a-unlimited.apk"
          ls -lh artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-android-${{ env.RELEASE_VERSION }}-unlimited
          path: artifacts/*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Qwen3 TTS Android ${{ env.RELEASE_VERSION }} Unlimited
          body: |
            Snapdragon 8 Elite turbo build with permanent signing key, anti-runaway 32-char CJK chunking + dynamic maxAudioTokens cap, streaming playback, 0.6B Q8 / 1.7B Q4 model selector, and local audio/video voice import.
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: artifacts/*.apk
