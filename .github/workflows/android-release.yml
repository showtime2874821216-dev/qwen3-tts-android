          private fun computeSafeMaxAudioTokens(piece: String): Int {
              var cjk = 0
              var other = 0
              for (ch in piece) {
                  if (ch.isWhitespace()) continue
                  val code = ch.code
                  if (code in 0x3000..0x9FFF || code in 0xAC00..0xD7AF || code in 0xFF00..0xFFEF) {
                      cjk++
                  } else {
                      other++
                  }
              }
              val est = (cjk * 6) + (other * 1.6).toInt() + 48
              return est.coerceIn(72, 220)
          }

          private fun splitLongTextUnlimited(raw: String): List<String> {
              val cleaned = raw
                  .replace("\\u200B", "")
                  .replace("\\uFEFF", "")
                  .replace("\\r\\n", "\\n")
                  .replace('\\r', '\\n')
                  .trim()
              if (cleaned.isEmpty()) return emptyList()

              val cjkCount = cleaned.count { it.code in 0x3000..0x9FFF || it.code in 0xAC00..0xD7AF }
              val isMostlyCjk = cjkCount * 3 >= cleaned.length
              val maxChars = if (isMostlyCjk) 32 else 90
              val minMergeChars = if (isMostlyCjk) 10 else 28

              val sentenceEnds = setOf('。', '！', '？', '!', '?', '\\n', '…', '；', ';')
              val clauseEnds = setOf('，', ',', '、', '：', ':')
              val closers = setOf('”', '’', '」', '』', ')', '）', '》', '"')

              val rawSentences = mutableListOf<String>()
              val buf = StringBuilder()
              var i = 0
              while (i < cleaned.length) {
                  val ch = cleaned[i]
                  if (ch == '\\n') {
                      val seg = buf.toString().trim()
                      if (seg.isNotEmpty()) rawSentences.add(seg)
                      buf.clear()
                      i++
                      continue
                  }
                  buf.append(ch)
                  val isDecimal = ch == '.' && i > 0 && i + 1 < cleaned.length && cleaned[i - 1].isDigit() && cleaned[i + 1].isDigit()
                  if (ch in sentenceEnds || (ch == '.' && !isDecimal)) {
                      while (i + 1 < cleaned.length && cleaned[i + 1] in closers) {
                          i++
                          buf.append(cleaned[i])
                      }
                      val seg = buf.toString().trim()
                      if (seg.isNotEmpty()) rawSentences.add(seg)
                      buf.clear()
                  }
                  i++
              }
              val tail = buf.toString().trim()
              if (tail.isNotEmpty()) rawSentences.add(tail)

              val bounded = mutableListOf<String>()
              for (seg in rawSentences) {
                  if (seg.length <= maxChars) {
                      bounded.add(seg)
                  } else {
                      var start = 0
                      while (start < seg.length) {
                          val end = minOf(start + maxChars, seg.length)
                          if (end == seg.length) {
                              val piece = seg.substring(start).trim()
                              if (piece.isNotEmpty()) bounded.add(piece)
                              break
                          }
                          var splitAt = -1
                          for (k in end downTo start + maxChars / 3) {
                              if (seg[k] in clauseEnds || (!isMostlyCjk && seg[k] == ' ')) {
                                  splitAt = k + 1
                                  break
                              }
                          }
                          if (splitAt <= start) splitAt = end
                          val piece = seg.substring(start, splitAt).trim()
                          if (piece.isNotEmpty()) bounded.add(piece)
                          start = splitAt
                      }
                  }
              }

              val merged = mutableListOf<String>()
              val cur = StringBuilder()
              for (piece in bounded) {
                  if (cur.isEmpty()) {
                      cur.append(piece)
                  } else if (cur.length < minMergeChars && cur.length + piece.length <= maxChars) {
                      if (!isMostlyCjk) cur.append(' ')
                      cur.append(piece)
                  } else {
                      merged.add(cur.toString().trim())
                      cur.clear()
                      cur.append(piece)
                  }
              }
              if (cur.isNotEmpty()) merged.add(cur.toString().trim())
              return merged
          }

          private fun mergeAudioChunksSmoothly(chunks: List<FloatArray>, sampleRate: Int): FloatArray {
              if (chunks.isEmpty()) return FloatArray(0)
              if (chunks.size == 1) return chunks[0]
              val pauseSamples = (sampleRate * 0.12).toInt()
              val fadeSamples = (sampleRate * 0.015).toInt()
              var totalLen = 0
              for (c in chunks) totalLen += c.size
              totalLen += pauseSamples * (chunks.size - 1)
              val out = FloatArray(totalLen)
              var pos = 0
              for (idx in chunks.indices) {
                  val c = chunks[idx]
                  val f = minOf(fadeSamples, c.size / 4)
                  for (i in c.indices) {
                      var v = c[i]
                      if (i < f) v *= (i.toFloat() / f.toFloat())
                      else if (i >= c.size - f) v *= ((c.size - 1 - i).toFloat() / f.toFloat())
                      out[pos + i] = v
                  }
                  pos += c.size
                  if (idx < chunks.lastIndex) pos += pauseSamples
              }
              return out
          }
