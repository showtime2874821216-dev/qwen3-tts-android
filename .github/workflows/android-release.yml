          print(np_body)

          m_tok = re.search(r"\b(max[A-Za-z0-9_]*(?:Token|Frame|Step|Len)[A-Za-z0-9_]*)\s*:\s*Int\b", np_body, re.I)
          max_tok_field = m_tok.group(1) if m_tok else None

          m_rep = re.search(r"\b(rep[A-Za-z0-9_]*Penalty)\s*:\s*(Float|Double)\b", np_body, re.I)
          rep_pen_field = m_rep.group(1) if m_rep else None
          rep_pen_type = m_rep.group(2) if m_rep else None

          print(f"Detected max_tok_field={max_tok_field}, rep_pen_field={rep_pen_field} ({rep_pen_type})")

          np_args = ["languageId = _uiState.value.selectedLanguageId"]
